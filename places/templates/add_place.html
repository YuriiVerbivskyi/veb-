{% extends "base.html" %}
{% block title %}Додати місце{% endblock %}
{% block content %}
<h2>Додати нове місце</h2>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <label>Назва*: <input type="text" name="name" required></label><br>
    <label>Тип: <input type="text" name="type"></label><br>
    <label>Локація: <input type="text" name="location"></label><br>
    <label>Опис*: <textarea name="description" required></textarea></label><br>
    <label>Рейтинг (1-5)*: <input type="number" name="rating" min="1" max="5" required></label><br>
    <button type="submit">Додати</button>
</form>
{% endblock %}
